name: Update BVB market data

on:
  schedule:
    # 17:23 UTC is after the BVB close in both Romanian summer and winter time.
    - cron: "23 17 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Calendar days to fetch, including today
        required: true
        default: 7
        type: number

concurrency:
  group: bvb-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and cache pip packages
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch recent BVB data
        env:
          BVB_EXCHSEGMENT: BSE
          BACKFILL_DAYS: ${{ github.event_name == 'schedule' && '7' || inputs.backfill_days }}
        run: python collector.py --backfill "$BACKFILL_DAYS"

      - name: Stage data changes
        run: |
          if find data -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            git add -A -- data/
          fi

      - name: Ignore fetchedAt-only changes
        run: |
          python - <<'PY'
          import json
          import subprocess

          paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--", "data"], text=True
          ).splitlines()

          for path in paths:
              if not path.endswith(".json"):
                  continue

              previous = subprocess.run(
                  ["git", "show", f"HEAD:{path}"], capture_output=True, text=True
              )
              staged = subprocess.run(
                  ["git", "show", f":{path}"], capture_output=True, text=True
              )
              # New and deleted files are real changes and remain staged.
              if previous.returncode or staged.returncode:
                  continue

              try:
                  before = json.loads(previous.stdout)
                  after = json.loads(staged.stdout)
              except json.JSONDecodeError:
                  continue

              before.pop("fetchedAt", None)
              after.pop("fetchedAt", None)
              if before == after:
                  subprocess.run(["git", "reset", "-q", "HEAD", "--", path], check=True)
                  print(f"Ignoring fetchedAt-only change: {path}")
          PY

      - name: Commit new or updated JSON files
        run: |
          if git diff --cached --quiet; then
            echo "No data changes apart from fetchedAt; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update BVB market data"
          git push
