name: Update BVB market data

on:
  schedule:
    # 17:23 UTC is after the BVB close in both Romanian summer and winter time.
    - cron: "23 17 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Calendar days to fetch, including today
        required: true
        default: 7
        type: number

concurrency:
  group: bvb-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and cache pip packages
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch recent BVB data
        env:
          BVB_EXCHSEGMENT: BSE
          BACKFILL_DAYS: ${{ github.event_name == 'schedule' && '7' || inputs.backfill_days }}
        run: python collector.py --backfill "$BACKFILL_DAYS"

      - name: Commit new or updated JSON files
        run: |
          if find data -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            git add -A -- data/
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update BVB market data"
          git push
