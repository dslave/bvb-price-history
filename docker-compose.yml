services:
  collector:
    build: .
    restart: "no"
    environment:
      BVB_HISTORY_URL: ${BVB_HISTORY_URL:-https://www.bvb.ro/TradingAndStatistics/Trading/HistoricalTradingInfo}
      DATA_DIR: /data
      SYMBOL_FILTER: ${SYMBOL_FILTER:-R2804AE}
    volumes:
      - ${DATA_HOST_PATH:-./data}:/data
